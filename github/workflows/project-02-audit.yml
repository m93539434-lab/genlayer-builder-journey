
name: Project 02 - GenLayer Contract Audit

on:
  push:
    branches:
      - main
    paths:
      - "projects/project-02-ai-powered-dapp/**"
      - ".github/workflows/project-02-audit.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-audit:
    name: Python and GenLayer Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Audit Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install genlayer-test genvm-linter

      - name: AUDIT 1 - Python Syntax
        working-directory: projects/project-02-ai-powered-dapp
        run: |
          python -m py_compile contracts/product_review_verifier.py
          python -m py_compile tests/test_product_review_verifier.py
          echo "PYTHON SYNTAX: PASS"

      - name: AUDIT 2 - GenLayer Contract Linter
        working-directory: projects/project-02-ai-powered-dapp
        run: |
          genvm-lint check contracts/product_review_verifier.py

      - name: AUDIT 3 - GenLayer Direct Mode Tests
        working-directory: projects/project-02-ai-powered-dapp
        run: |
          python -m pytest tests/ -v

      - name: AUDIT SUMMARY
        run: |
          echo "Project 02 audit workflow completed."
